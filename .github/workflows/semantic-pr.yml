name: "Semantic PR Title Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

permissions:
  pull-requests: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    uses: Cooper-Wallace/repokit/.github/workflows/semantic-pr.yml@v1
