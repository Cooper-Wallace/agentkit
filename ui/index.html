<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentKit Caffeine Dock HUD</title>
    <link rel="stylesheet" href="/src/styles/glassmorphism.css" />
    <style>
      :root {
        --bg-desktop: #0f141c;
        --panel-bg: rgba(22, 28, 38, 0.75);
        --panel-border: rgba(255, 255, 255, 0.12);
        --accent-cyan: #00e5ff;
        --accent-amber: #ffb300;
        --accent-green: #00e676;
        --accent-blue: #2979ff;
        --accent-orange: #ff9100;
        --text-main: #f0f4f8;
        --text-muted: #8b9bb4;
        --glass-blur: blur(16px);
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, Cantarell, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        background: radial-gradient(circle at 50% 20%, #1e2638 0%, var(--bg-desktop) 100%);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        user-select: none;
      }

      /* Mock Desktop Top Bar (Plasma 6 style) */
      .desktop-top-bar {
        height: 38px;
        background: rgba(12, 16, 23, 0.85);
        border-bottom: 1px solid var(--panel-border);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        font-size: 13px;
        z-index: 100;
      }

      .top-bar-left {
        display: flex;
        align-items: center;
        gap: 16px;
        color: var(--text-muted);
      }

      .panel-brand {
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel-brand svg {
        color: var(--accent-cyan);
      }

      .top-bar-right {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* Desktop Viewport Canvas */
      .desktop-area {
        flex: 1;
        position: relative;
        min-height: calc(100vh - 38px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 140px;
      }

      /* Dock Pill Floating Positions */
      .hud-pill-container {
        position: absolute;
        top: 24px;
        transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hud-pill-container.pos-top-center {
        left: 50%;
        transform: translateX(-50%);
        right: auto;
        bottom: auto;
      }

      .hud-pill-container.pos-top-right {
        right: 32px;
        left: auto;
        transform: none;
        bottom: auto;
        align-items: flex-end;
      }

      .hud-pill-container.pos-bottom-right {
        bottom: 140px;
        top: auto;
        right: 32px;
        left: auto;
        transform: none;
        align-items: flex-end;
      }

      .hud-pill-container.state-idle {
        opacity: 0.7;
      }

      /* Pill Sub-elements */
      .hud-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .hud-status-text {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .cooldown-indicator {
        font-size: 11px;
        color: var(--accent-amber);
        font-weight: 600;
        font-family: var(--font-mono);
      }

      .lock-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(0, 229, 255, 0.12);
        border: 1px solid rgba(0, 229, 255, 0.3);
        color: var(--accent-cyan);
        flex-shrink: 0;
      }

      .state-cooldown .lock-badge {
        background: rgba(255, 179, 0, 0.12);
        border-color: rgba(255, 179, 0, 0.3);
        color: var(--accent-amber);
      }

      .state-override .lock-badge {
        background: rgba(41, 121, 255, 0.12);
        border-color: rgba(41, 121, 255, 0.3);
        color: var(--accent-blue);
      }

      .state-idle .lock-badge {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
      }

      /* Expanded Card Content Rows */
      .card-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        color: var(--text-muted);
        padding: 2px 0;
      }

      .card-row span:last-child {
        color: var(--text-main);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .leases-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .lease-item {
        background: rgba(255, 255, 255, 0.04);
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .lease-badge {
        background: rgba(147, 51, 234, 0.25);
        border: 1px solid rgba(168, 85, 247, 0.4);
        color: #c084fc;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 6px;
        text-transform: uppercase;
      }

      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }

      .action-btn {
        flex: 1;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-main);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }

      .action-btn:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .action-btn[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .circuit-breaker-warning {
        display: inline-flex;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #f87171;
      }

      /* Bottom Developer Preview Toolbar */
      .demo-controls-dock {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(16, 22, 32, 0.92);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 14px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 760px;
        width: calc(100% - 40px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        z-index: 100;
      }

      .dock-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 8px;
      }

      .dock-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--accent-cyan);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dock-subtitle {
        font-size: 11px;
        color: var(--text-muted);
      }

      .dock-section {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .dock-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        min-width: 100px;
      }

      .dock-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        flex: 1;
      }

      .dock-btn {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-main);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }

      .dock-btn:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.25);
      }

      .dock-btn.active {
        background: rgba(0, 229, 255, 0.18);
        border-color: var(--accent-cyan);
        color: var(--accent-cyan);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Top Mockup Panel -->
    <header class="desktop-top-bar">
      <div class="top-bar-left">
        <div class="panel-brand">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
          <span>AgentKit Workstation Plasma 6</span>
        </div>
        <span>Konsole</span>
        <span>Projects</span>
      </div>
      <div class="top-bar-right">
        <span>🛡️ Sleep Guard Active</span>
        <span>🔋 92%</span>
        <span>14:07</span>
      </div>
    </header>

    <!-- Desktop Canvas Area where #app is mounted -->
    <main class="desktop-area">
      <div id="app"></div>

      <!-- Developer Preview Simulation Toolbar -->
      <aside class="demo-controls-dock">
        <div class="dock-title-row">
          <div class="dock-title">
            <span>🎮 Caffeine Dock HUD Interactive Preview</span>
          </div>
          <span class="dock-subtitle">Simulate daemon state & positions without live daemon</span>
        </div>

        <div class="dock-section">
          <span class="dock-label">Simulate State:</span>
          <div class="dock-buttons">
            <button id="btn-state-active" class="dock-btn" onclick="simulateState('active')">
              ⚡ Active (Running)
            </button>
            <button id="btn-state-cooldown" class="dock-btn" onclick="simulateState('cooldown')">
              ⏳ Cooldown (45s)
            </button>
            <button id="btn-state-idle" class="dock-btn active" onclick="simulateState('idle')">
              💤 Idle
            </button>
            <button id="btn-state-override" class="dock-btn" onclick="simulateState('override')">
              🔒 Override (Force Awake)
            </button>
          </div>
        </div>

        <div class="dock-section">
          <span class="dock-label">Screen Position:</span>
          <div class="dock-buttons">
            <button id="btn-pos-top-center" class="dock-btn active" onclick="changePosition('pos-top-center')">
              Top Center
            </button>
            <button id="btn-pos-top-right" class="dock-btn" onclick="changePosition('pos-top-right')">
              Top Right
            </button>
            <button id="btn-pos-bottom-right" class="dock-btn" onclick="changePosition('pos-bottom-right')">
              Bottom Right
            </button>
          </div>
        </div>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
    <script>
      // Simulation States
      const mockStates = {
        active: {
          state: 'active',
          active_inhibitor: 'org.freedesktop.login1',
          lock_held: true,
          cooldown_remaining_seconds: 0,
          override_remaining_seconds: 0,
          active_leases: [
            {
              session_id: 'subagent-42',
              model: 'GEMINI-3.8-FLASH',
              state: 'RUNNING',
              description: 'Auto-lifecycle test verification [Phase 4]',
              started_at: '2026-11-06T22:00:00Z',
            },
          ],
          hardware: {
            battery_percent: 92,
            is_charging: true,
            cpu_temp_c: 48,
            lid_closed: false,
          },
          circuit_breakers: {
            battery_tripped: false,
            thermal_tripped: false,
            lid_tripped: false,
            ceiling_tripped: false,
          },
        },
        cooldown: {
          state: 'cooldown',
          active_inhibitor: 'org.freedesktop.login1',
          lock_held: true,
          cooldown_remaining_seconds: 45,
          override_remaining_seconds: 0,
          active_leases: [],
          hardware: {
            battery_percent: 92,
            is_charging: true,
            cpu_temp_c: 45,
            lid_closed: false,
          },
        },
        idle: {
          state: 'idle',
          active_inhibitor: 'none',
          lock_held: false,
          cooldown_remaining_seconds: 0,
          override_remaining_seconds: 0,
          active_leases: [],
          hardware: {
            battery_percent: 92,
            is_charging: true,
            cpu_temp_c: 42,
            lid_closed: false,
          },
        },
        override: {
          state: 'override',
          active_inhibitor: 'org.freedesktop.login1',
          lock_held: true,
          cooldown_remaining_seconds: 0,
          override_remaining_seconds: 3600,
          active_leases: [],
          hardware: {
            battery_percent: 92,
            is_charging: true,
            cpu_temp_c: 44,
            lid_closed: false,
          },
        },
      };

      function simulateState(stateKey) {
        document.querySelectorAll('[id^="btn-state-"]').forEach((btn) => btn.classList.remove('active'));
        const targetBtn = document.getElementById(`btn-state-${stateKey}`);
        if (targetBtn) targetBtn.classList.add('active');

        if (window.__caffeineDock?.pill) {
          window.__caffeineDock.pill.update(mockStates[stateKey]);
        }
      }

      function changePosition(positionKey) {
        document.querySelectorAll('[id^="btn-pos-"]').forEach((btn) => btn.classList.remove('active'));
        const targetBtn = document.getElementById(`btn-${positionKey}`);
        if (targetBtn) targetBtn.classList.add('active');

        if (window.__caffeineDock?.pill) {
          window.__caffeineDock.pill.setPosition(positionKey);
        }
      }

      window.simulateState = simulateState;
      window.changePosition = changePosition;
    </script>
  </body>
</html>
